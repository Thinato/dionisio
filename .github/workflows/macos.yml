name: macos
on:
  pull_request:
    paths: [src/core/**, src/tui/**, CMakeLists.txt, tests/core_test.cpp, tests/fixtures/**]
  push:
    paths: [src/core/**, src/tui/**, CMakeLists.txt, tests/core_test.cpp, tests/fixtures/**]

jobs:
  tui:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DOPENSSL_ROOT_DIR=$(brew --prefix openssl@3)
          cmake --build build -j --target dionisio core_test
          ctest --test-dir build -R core --output-on-failure
